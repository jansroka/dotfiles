---
# use 'duti -x jpg' to get current assocation
# use 'duti -e avi' to get UTI declarations for extension
# use 'duti -vs dev.zed.Zed .c all' to figure out uti names

# use 'lsappinfo | grep 'bundleID="' | cut -d'"' -f2 | sort | uniq'
#   to get a list of all bundle_id's on your system

# use 'mdls -name kMDItemContentType -name kMDItemContentTypeTree -name kMDItemKind <existingfile>'
# to get current uti
duti_default_apps_associations:
  # Zed
  - bundle_id: dev.zed.Zed
    utis:
      - public.json
      - public.text
      - public.yaml

  # IINA
  - bundle_id: com.colliderli.iina
    utis:
      - .avi
      - .mkv
      - .mp4
      - .mpeg

  # Keka
  - bundle_id: com.aone.keka
    utis:
      # - .zip  # we can't use zip, it's protected by OSX
      # .rar/.7z have no system UTI without The Unarchiver, so use the UTIs Keka declares.
      - com.rarlab.rar-archive
      # - .tar  # we can't use zip, it's protected by OSX
      - org.7-zip.7-zip-archive

  # Simple Comic
  - bundle_id: com.ToWatchList.SimpleComic
    utis:
      - .cb7
      - .cbr
      - .cbt
      - .cbz

  # Preview
  - bundle_id: com.apple.Preview
    utis:
      - .bmp
      - .jpeg
      - .jpg
      - .pdf
      - .tif
      - .tiff

  # CleanShot X
  - bundle_id: pl.maketheweb.cleanshotx
    utis:
      - .png
