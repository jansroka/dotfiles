---
# Based on https://github.com/fgimian/macbuild-ansible/blob/master/roles/default_apps/tasks/main.yaml
- name: Ensure duti is installed
  community.general.homebrew:
    name: duti
    state: present
  tags: duti

# duti -s fails for a bundle ID that is not installed, so those apps are skipped.
- name: Find installed apps for file type associations
  ansible.builtin.command:
    argv: [mdfind, "kMDItemCFBundleIdentifier == '{{ item.bundle_id }}'"]
  loop: "{{ duti_default_apps_associations }}"
  loop_control:
    label: "{{ item.bundle_id }}"
  register: duti_app_check
  changed_when: false
  check_mode: false
  tags: duti

- name: Filter to associations of installed apps
  ansible.builtin.set_fact:
    duti_installed_associations: "{{ duti_app_check.results | selectattr('stdout') | map(attribute='item') | list }}"
  tags: duti

# Entries starting with a dot are file extensions, everything else is a UTI.
# `duti -x` prints app name, path and bundle ID; `duti -d` prints only the bundle ID.
# Both exit non-zero when no default app is set, which counts as a mismatch.
- name: Check file type association
  ansible.builtin.command:
    argv: "{{ ['duti', '-x' if item.1.startswith('.') else '-d', item.1] }}"
  loop: "{{ duti_installed_associations | subelements('utis') }}"
  loop_control:
    label: "{{ item.1 }}"
  register: duti_output
  changed_when: false
  failed_when: false
  check_mode: false
  tags: duti

# macOS applies the change a few seconds after duti returns, and from
# macOS 26.4 may ask the user to confirm each change.
- name: Update file type association
  ansible.builtin.command:
    argv: [duti, -s, "{{ item.item.0.bundle_id }}", "{{ item.item.1 }}", all]
  loop: "{{ duti_output.results }}"
  loop_control:
    label: "{{ item.item.1 }} -> {{ item.item.0.bundle_id }}"
  when: item.item.0.bundle_id not in item.stdout_lines
  changed_when: true
  notify:
    - Kill Finder
  tags: duti
