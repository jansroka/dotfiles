---
brew_taps:
  - heroku/brew
  - stripe/stripe-cli
  - upcloudltd/tap
  # Note: homebrew/bundle and homebrew/services are now part of core Homebrew
  # Note: microsoft/git is no longer needed; git is available from core Homebrew

brew_packages:
  # --- Core System Tools ---
  - bash
  - zsh
  - coreutils
  - diffutils
  - gzip
  - less
  - nano
  - openssh
  - rsync
  - wget
  - tree

  # --- Version Managers ---
  - nvm
  - pyenv
  - rbenv
  - ruby-build # Don't install ruby from homebrew; use rbenv for this

  # --- Python Tools & Package Management ---
  - pipx
  - uv # modern Python package manager
  - pre-commit
  - python@3.14

  # --- Build Tools & Compilers ---
  - autoconf
  - automake
  - binutils
  - cmake

  # --- Ruby Dependencies ---
  - gmp # rbenv/ruby requirement
  - libffi
  - libyaml # rbenv/ruby requirement
  - openssl@3 # rbenv/ruby requirement
  - readline # rbenv/ruby requirement
  - zlib

  # --- Development Tools ---
  - ansible
  - ansible-lint
  - direnv
  - duti
  - exiftool
  - gh
  - git
  - gnupg
  - shellcheck
  - stripe
  - yamllint
  - yq

  # --- Cloud & Infrastructure CLIs ---
  - awscli
  - hcloud
  - heroku/brew/heroku
  - upcloudltd/tap/upcloud-cli

  # --- Database & Network Tools ---
  - jq # JSON processor
  - libpq # postgres requirement
  - nmap
  - postgresql@18

  # --- System Utilities ---
  - duf # disk usage
  - htop # system monitor
  - mas # Mac App Store CLI
  - tidy-html5
  - wifi-password

brew_cask_packages:
  # --- Development & Coding ---
  - github
  - iterm2
  - visual-studio-code
  - zed

  # --- Browsers & Web ---
  - firefox
  - google-chrome
  - ngrok

  # --- Communication & Collaboration ---
  - element
  - microsoft-teams
  - signal
  - slack
  - thunderbird

  # --- Cloud & Infrastructure ---
  - orbstack # provides docker CLI; replaces Docker Desktop

  # --- Productivity & Office ---
  - google-drive
  - microsoft-auto-update
  - microsoft-office
  - obsidian
  - omnifocus
  - scrivener
  - timing

  # --- Media & Entertainment ---
  - keka # open source alternative to the unarchiver
  - kindle
  - simple-comic
  - spotify
  - transmission
  - vlc

  # --- Utilities & Tools ---
  - 1password
  - arq # backup
  - authy
  - cyberduck
  - scansnap-home
  - git-credential-manager
  - hazel
  - little-snitch
  - maccy
  - macfuse
  - maestral
  - netnewswire
  - superduper
  - tabula
  - teamviewer
  - utm
  - veracrypt
  - zoom

# Only app-based extensions (.appex): macOS 15+ no longer loads .qlgenerator plugins.
# Casks installed only for their Quick Look extension. Other apps in brew_cask_packages
# bring their own (see brew_ql_extension_casks).
brew_cask_ql_packages:
  - apparency # app bundles
  - quicklook-video
  - suspicious-package # installer packages
  - syntax-highlight # source code, JSON, extensionless text

# Casks from brew_cask_packages whose bundled Quick Look extension the role enables.
brew_ql_extension_casks:
  - obsidian # Markdown preview
