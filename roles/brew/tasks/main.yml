---
- name: Configure Homebrew taps
  community.general.homebrew_tap:
    name: "{{ item }}"
  loop: "{{ brew_taps }}"
  tags: brew

- name: Install Homebrew formulae
  community.general.homebrew:
    name: "{{ brew_packages }}"
    state: present
  tags: brew

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    greedy: true
    state: present
  loop: "{{ brew_cask_packages }}"
  tags: brew

- name: Install QuickLook plugins
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: latest
  loop: "{{ brew_cask_ql_packages }}"
  tags: [brew, quicklook]

# An app extension stays inactive until its app has launched, so a fresh install
# previews nothing. `pluginkit -a` adds it and `-e use` enables it, without a launch.
# Covers Quick Look extensions and media extensions (quicklook-video decodes via those);
# other extensions in these apps (Shortcuts actions) are left alone.
- name: Enable Quick Look and media extensions
  ansible.builtin.shell: |
    set -o pipefail
    brew info --json=v2 --cask {{ (brew_cask_ql_packages + brew_ql_extension_casks) | map('quote') | join(' ') }} |
      jq -r '.casks[].artifacts[] | .app? // empty | .[] | strings' |
      while read -r app; do
        find "/Applications/$app/Contents" -maxdepth 2 -name '*.appex' | while read -r ext; do
          point=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$ext/Contents/Info.plist" 2>/dev/null ||
            plutil -extract EXAppExtensionAttributes.EXExtensionPointIdentifier raw "$ext/Contents/Info.plist" 2>/dev/null || true)
          case "$point" in com.apple.quicklook.* | com.apple.mediaextension.*) ;; *) continue ;; esac
          id=$(plutil -extract CFBundleIdentifier raw "$ext/Contents/Info.plist")
          # Enabled extensions are listed with a leading "+".
          if ! pluginkit -m -i "$id" | grep -q '^+'; then
            pluginkit -a "$ext"
            pluginkit -e use -i "$id"
            echo "enabled $id"
          fi
        done
      done
  register: brew_ql_enable
  changed_when: brew_ql_enable.stdout != ''
  tags: [brew, quicklook]

- name: Update brew itself
  community.general.homebrew:
    update_homebrew: true
  tags: brew

- name: Upgrade all brew formulae
  ansible.builtin.command: brew upgrade --formula
  changed_when: true
  tags: brew

- name: Update & upgrade casks
  community.general.homebrew_cask:
    upgrade_all: true
    sudo_password: "{{ ansible_become_password }}"
  tags: brew

- name: Cleanup brew
  ansible.builtin.command: brew cleanup
  changed_when: false
  tags: brew

# Delete brew caches
- name: Find brew cache path
  ansible.builtin.command: brew --cache
  register: brew_cache_path
  changed_when: false
  tags: maintenance, softwareupdate

- name: Delete brew cache
  ansible.builtin.file:
    path: '{{ brew_cache_path.stdout }}'
    state: absent
  tags: maintenance, softwareupdate

- name: Repair taps
  ansible.builtin.command: brew tap --repair
  changed_when: false
  tags: maintenance, softwareupdate
