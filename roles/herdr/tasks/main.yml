---
# Herdr.app is installed from herdr.dev, not Homebrew (the `herdr` formula is
# a different terminal-only tool), so this role only links config.
# Files are linked one by one, not whole folders: ~/.config/herdr-app also
# holds app state (view.json, data/, layouts/.state/), and Herdr rewrites
# mods/<name>/gpui-kit.d.ts on every start.
- name: Ensure Herdr config folders exist
  ansible.builtin.file:
    path: "/Users/jan/.config/herdr-app/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - layouts
    - mods/my-agents
  tags: herdr

- name: Symlink Herdr layouts and mods
  ansible.builtin.file:
    src: "/Users/jan/Code/Private/dotfiles/roles/herdr/files/{{ item }}"
    dest: "/Users/jan/.config/herdr-app/{{ item }}"
    state: link
    force: true
    follow: false
  loop:
    - layouts/my-layout.json
    - mods/my-agents/main.js
    - mods/my-agents/mod.json
    - mods/my-agents/jsconfig.json
  tags: herdr

# Herdr is installed by hand, so a fresh machine may not have it yet.
- name: Find the Herdr app
  ansible.builtin.stat:
    path: /Applications/Herdr.app/Contents/MacOS/Herdr
  register: herdr_app
  tags: herdr

# Fails the run on a broken mod instead of at Herdr's next start.
- name: Check the Herdr mod loads
  ansible.builtin.command:
    argv:
      - /Applications/Herdr.app/Contents/MacOS/Herdr
      - check
      - /Users/jan/.config/herdr-app/mods/my-agents
  changed_when: false
  when: herdr_app.stat.exists
  tags: herdr
