---
dock_icon_size: 70

# Dock items to remove.
dock_items_remove:
  - all

# Dock items, in Dock order. Apps that are not installed are skipped.
# The Dock is rebuilt whenever it differs from this list, so anything
# added to the Dock by hand is removed on the next run.
dock_items_persist:
  - name: "Zed"
    path: "/Applications/Zed.app"
  - name: "Element"
    path: "/Applications/Element.app"
  - name: "Visual Studio Code"
    path: "/Applications/Visual Studio Code.app"
  - name: "Microsoft Outlook"
    path: "/Applications/Microsoft Outlook.app"
  - name: "OmniFocus"
    path: "/Applications/OmniFocus.app"
  - name: "Firefox"
    path: "/Applications/Firefox.app"
  - name: "Obsidian"
    path: "/Applications/Obsidian.app"
  - name: "Thunderbird"
    path: "/Applications/Thunderbird.app"
  - name: "iTerm"
    path: "/Applications/iTerm.app"
