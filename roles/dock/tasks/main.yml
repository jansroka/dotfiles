---
# from https://github.com/geerlingguy/ansible-collection-mac
# Note: Using native macOS APIs instead of dockutil for better compatibility.

- name: Set Dock settings
  community.general.osx_defaults: domain=com.apple.dock key={{ item.key }} type={{ item.type }} value={{ item.value }}
  loop:
    # Enable highlight hover effect for the grid view of a stack (Dock)
    - {key: "mouse-over-hilite-stack", type: "bool", value: "true"}
    # Set the icon size (px) of Dock items
    - {key: "tilesize", type: "float", value: "{{ dock_icon_size }}"}
    # Show indicator lights for open applications in the Dock
    - {key: "show-process-indicators", type: "bool", value: "true"}
    # Speed up Mission Control animations
    - {key: "expose-animation-duration", type: "float", value: "0.1"}
    # Don’t show Dashboard as a Space
    - {key: "dashboard-in-overlay", type: "bool", value: "false"}
  notify:
    - Kill Dock
  tags: dock

- name: Get current dock persistent apps
  ansible.builtin.command: defaults read com.apple.dock persistent-apps
  register: dock_current_items
  changed_when: false
  failed_when: false
  check_mode: false
  tags: dock

- name: Verify dock apps exist
  ansible.builtin.stat:
    path: "{{ item.path }}"
  register: dock_app_check
  loop: "{{ dock_items_persist }}"
  tags: dock

# Missing apps are left out of the comparison too, otherwise the Dock would
# never match and every run would rebuild it.
- name: Filter to only existing apps
  ansible.builtin.set_fact:
    dock_items_to_add: "{{ dock_app_check.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  tags: dock

# The Dock stores each app as a file URL, e.g. file:///Applications/Visual%20Studio%20Code.app/
- name: Collect current and expected dock app URLs
  ansible.builtin.set_fact:
    dock_current_urls: >-
      {{ dock_current_items.stdout | regex_findall('_CFURLString" = "([^"]+)"') }}
    dock_expected_urls: >-
      {{ dock_items_to_add | map(attribute='path') | map('urlencode')
         | map('regex_replace', '^', 'file://') | map('regex_replace', '$', '/') | list }}
  tags: dock

- name: Check if dock needs updating
  ansible.builtin.set_fact:
    dock_needs_update: "{{ dock_current_items.rc != 0 or dock_current_urls != dock_expected_urls }}"
  tags: dock

- name: Reset and repopulate dock (only if needed)
  when: dock_needs_update
  tags: dock
  block:
    - name: Clear dock items
      ansible.builtin.command: defaults write com.apple.dock persistent-apps -array
      become: true
      become_user: jan

    - name: Add dock items
      ansible.builtin.command: >
        defaults write com.apple.dock persistent-apps -array-add
        "<dict><key>tile-data</key><dict><key>file-data</key><dict><key>_CFURLString</key><string>file://{{ item.path | urlencode }}/</string><key>_CFURLStringType</key><integer>15</integer></dict></dict><key>tile-type</key><string>file-tile</string></dict>"
      become: true
      become_user: jan
      loop: "{{ dock_items_to_add }}"

    - name: Kill Dock to apply changes
      ansible.builtin.command: killall Dock
      become: true
